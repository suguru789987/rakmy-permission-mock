<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="会社と店舗の区分"><title>会社と店舗の区分</title><rect width="1000" height="330" fill="#fff"/><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}</style><text x="500.0" y="32" text-anchor="middle" font-size="15" fill="#5b6b7c" font-weight="400">権限は会社か店舗のどちらかに属します。1つの権限で両方は扱えません</text><line x1="500" y1="52" x2="500" y2="300" stroke="#c9d6e0" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="60" y="62" width="400" height="74" rx="10" fill="#f7f7f9" stroke="#c9d6e0" stroke-width="1.5"/><text x="260" y="92" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="600">共通の画面（17種類）</text><text x="260" y="116" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">ダッシュボード・売上分析・従業員管理 など</text><text x="260" y="166" text-anchor="middle" font-size="18" fill="#1f7a8c" font-weight="700">＋</text><rect x="60" y="186" width="400" height="76" rx="10" fill="#eef6f8" stroke="#1f7a8c" stroke-width="1.5"/><text x="260" y="216" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="600">会社の画面（4種類）</text><text x="260" y="240" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">会社情報・お支払い・店舗管理・ダウンロード</text><text x="260" y="296" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="700">区分「会社」＝ 21画面</text><rect x="540" y="62" width="400" height="74" rx="10" fill="#f7f7f9" stroke="#c9d6e0" stroke-width="1.5"/><text x="740" y="92" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="600">共通の画面（17種類）</text><text x="740" y="116" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">ダッシュボード・売上分析・従業員管理 など</text><text x="740" y="166" text-anchor="middle" font-size="18" fill="#1f7a8c" font-weight="700">＋</text><rect x="540" y="186" width="400" height="76" rx="10" fill="#eef6f8" stroke="#1f7a8c" stroke-width="1.5"/><text x="740" y="216" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="600">店舗の画面（6種類）</text><text x="740" y="240" text-anchor="middle" font-size="11" fill="#5b6b7c" font-weight="400">発注先&amp;仕入商品・店舗情報・連携設定・費用設定・休業日設定・予算設定</text><text x="740" y="296" text-anchor="middle" font-size="16" fill="#1f2d3d" font-weight="700">区分「店舗」＝ 23画面</text></svg>