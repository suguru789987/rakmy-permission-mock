<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="権限と担当店舗の関係"><title>権限と担当店舗の関係</title><rect width="1000" height="340" fill="#fff"/><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}</style><text x="500.0" y="32" text-anchor="middle" font-size="15" fill="#5b6b7c" font-weight="400">権限は共通のものを使い、どの店舗を見せるかは人ごとに設定します</text><rect x="60" y="130" width="230" height="92" rx="10" fill="#eef6f8" stroke="#1f7a8c" stroke-width="1.5"/><text x="175" y="170" text-anchor="middle" font-size="18" fill="#1f2d3d" font-weight="600">権限「店長」</text><text x="175" y="194" text-anchor="middle" font-size="13" fill="#5b6b7c" font-weight="400">1つ作れば全員で共有</text><text x="175" y="246" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">権限設定で作る</text><path d="M290 176 C 400 176, 430 125, 555 125" fill="none" stroke="#1f7a8c" stroke-width="2"/><path d="M566 125 L555 119 L555 131 Z" fill="#1f7a8c"/><rect x="575" y="92" width="365" height="66" rx="10" fill="#fff" stroke="#c9d6e0" stroke-width="1.5"/><text x="757" y="121" text-anchor="middle" font-size="17" fill="#1f2d3d" font-weight="600">渋谷店の店長 Aさん</text><text x="757" y="143" text-anchor="middle" font-size="13" fill="#5b6b7c" font-weight="400">担当店舗：渋谷店</text><path d="M290 176 C 400 176, 430 203, 555 203" fill="none" stroke="#1f7a8c" stroke-width="2"/><path d="M566 203 L555 197 L555 209 Z" fill="#1f7a8c"/><rect x="575" y="170" width="365" height="66" rx="10" fill="#fff" stroke="#c9d6e0" stroke-width="1.5"/><text x="757" y="199" text-anchor="middle" font-size="17" fill="#1f2d3d" font-weight="600">新宿店の店長 Bさん</text><text x="757" y="221" text-anchor="middle" font-size="13" fill="#5b6b7c" font-weight="400">担当店舗：新宿店</text><path d="M290 176 C 400 176, 430 281, 555 281" fill="none" stroke="#1f7a8c" stroke-width="2"/><path d="M566 281 L555 275 L555 287 Z" fill="#1f7a8c"/><rect x="575" y="248" width="365" height="66" rx="10" fill="#fff" stroke="#c9d6e0" stroke-width="1.5"/><text x="757" y="277" text-anchor="middle" font-size="17" fill="#1f2d3d" font-weight="600">池袋店の店長 Cさん</text><text x="757" y="299" text-anchor="middle" font-size="13" fill="#5b6b7c" font-weight="400">担当店舗：池袋店</text><text x="757" y="330" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">ユーザー割当で人ごとに設定する　※複数の店舗や「全店」も選べます</text></svg>