<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="権限設定のご利用の流れ"><title>権限設定のご利用の流れ</title><rect width="1000" height="250" fill="#fff"/><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}</style><text x="500.0" y="34" text-anchor="middle" font-size="15" fill="#5b6b7c" font-weight="400">はじめて設定する場合は、この順番がおすすめです</text><rect x="0.0" y="70" width="176" height="112" rx="10" fill="#f4f9fb" stroke="#c9d6e0" stroke-width="1.5"/><circle cx="22.0" cy="92" r="13" fill="#1f7a8c"/><text x="22.0" y="97" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">1</text><text x="88.0" y="128" text-anchor="middle" font-size="15.5" fill="#1f2d3d" font-weight="600">導入時の初期設定</text><text x="88.0" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">よく使う権限を</text><text x="88.0" y="167" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">まとめて登録</text><line x1="181.0" y1="126" x2="192.0" y2="126" stroke="#1f7a8c" stroke-width="2"/><path d="M201.0 126 L191.0 120.5 L191.0 131.5 Z" fill="#1f7a8c"/><rect x="206.0" y="70" width="176" height="112" rx="10" fill="#f4f9fb" stroke="#c9d6e0" stroke-width="1.5"/><circle cx="228.0" cy="92" r="13" fill="#1f7a8c"/><text x="228.0" y="97" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">2</text><text x="294.0" y="128" text-anchor="middle" font-size="15.5" fill="#1f2d3d" font-weight="600">権限を作成する</text><text x="294.0" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">足りない権限を</text><text x="294.0" y="167" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">貴社に合わせて追加</text><line x1="387.0" y1="126" x2="398.0" y2="126" stroke="#1f7a8c" stroke-width="2"/><path d="M407.0 126 L397.0 120.5 L397.0 131.5 Z" fill="#1f7a8c"/><rect x="412.0" y="70" width="176" height="112" rx="10" fill="#f4f9fb" stroke="#c9d6e0" stroke-width="1.5"/><circle cx="434.0" cy="92" r="13" fill="#1f7a8c"/><text x="434.0" y="97" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">3</text><text x="500.0" y="128" text-anchor="middle" font-size="15.5" fill="#1f2d3d" font-weight="600">メンバーに割り当てる</text><text x="500.0" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">誰にどの権限を</text><text x="500.0" y="167" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">付けるか決める</text><line x1="593.0" y1="126" x2="604.0" y2="126" stroke="#1f7a8c" stroke-width="2"/><path d="M613.0 126 L603.0 120.5 L603.0 131.5 Z" fill="#1f7a8c"/><rect x="618.0" y="70" width="176" height="112" rx="10" fill="#f4f9fb" stroke="#c9d6e0" stroke-width="1.5"/><circle cx="640.0" cy="92" r="13" fill="#1f7a8c"/><text x="640.0" y="97" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">4</text><text x="706.0" y="128" text-anchor="middle" font-size="15.5" fill="#1f2d3d" font-weight="600">担当店舗を設定する</text><text x="706.0" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">店舗の権限を付けた方に</text><text x="706.0" y="167" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">担当店舗を紐付け</text><line x1="799.0" y1="126" x2="810.0" y2="126" stroke="#1f7a8c" stroke-width="2"/><path d="M819.0 126 L809.0 120.5 L809.0 131.5 Z" fill="#1f7a8c"/><rect x="824.0" y="70" width="176" height="112" rx="10" fill="#f4f9fb" stroke="#c9d6e0" stroke-width="1.5"/><circle cx="846.0" cy="92" r="13" fill="#1f7a8c"/><text x="846.0" y="97" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">5</text><text x="912.0" y="128" text-anchor="middle" font-size="15.5" fill="#1f2d3d" font-weight="600">権限一覧で確認する</text><text x="912.0" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">誰が何の権限を</text><text x="912.0" y="167" text-anchor="middle" font-size="12.5" fill="#5b6b7c" font-weight="400">持っているか確認</text><rect x="0.0" y="200" width="794" height="30" rx="6" fill="#eef6f8" stroke="#1f7a8c" stroke-width="1" stroke-dasharray="4 3"/><text x="397.0" y="220" text-anchor="middle" font-size="13" fill="#1f7a8c" font-weight="600">ここまでで初期設定は完了です</text></svg>